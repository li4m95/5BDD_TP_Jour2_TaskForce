services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: dataflow-oracle
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: TaskForce2024!
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle_data:
    name: dataflow_oracle_data
